# Prod overrides. Layered on top of argocd/values.yaml.
#
# Install (after prod AKS is up + kubectl context set to prod):
#   helm upgrade --install argocd argo/argo-cd \
#     -n argocd --create-namespace \
#     -f argocd/values.yaml -f argocd/prod-values.yaml

# Prod node: Standard_D4s_v5 (4 vCPU / 16 GB), 1-2 nodes autoscaled.
# Bigger resource requests; tighter limits than dev.
controller:
  replicas: 2  # sharded controller for HA + cluster distribution
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

server:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false  # turn on once ingress traffic is real

repoServer:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi

applicationSet:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# HA Redis (3-node Sentinel cluster) — required for prod.
redis-ha:
  enabled: true

# SSO is wired up later (Keycloak). Until then, built-in admin works.
dex:
  enabled: false

configs:
  params:
    # In prod, ingress + cert-manager terminate TLS. argocd-server runs HTTP behind it.
    server.insecure: true

  # Repos ArgoCD is allowed to access.
  repositories:
    app-deployer:
      url: https://github.com/Pritam224/Internal-developer-Platform
      type: git
      name: app-deployer

# Bootstrap Application — points at the PROD overlay of the gitops folder.
extraObjects:
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: root
      namespace: argo-cd
      annotations:
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-weight: "5"
    spec:
      project: default
      source:
        repoURL: https://github.com/Pritam224/Internal-developer-Platform
        path: infra-manifest/prod
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
