name: Infra

# Manual provision / destroy of an environment.
# Pick env + action; the job runs against that environment's Terraform folder.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options: [dev, prod]
      action:
        description: "Action to perform"
        type: choice
        required: true
        options: [plan, apply, destroy]

# Required for federated OIDC token from GitHub → Azure
permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.5"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # gates prod behind required reviewers
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform plan -out=tfplan -input=false

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false tfplan

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false
