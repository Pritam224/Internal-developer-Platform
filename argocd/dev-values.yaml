# Dev-only overrides. Layered on top of argocd/values.yaml.
#
# Install:
#   helm upgrade --install argocd argo/argo-cd \
#     -n argocd --create-namespace \
#     -f argocd/values.yaml -f argocd/dev-values.yaml

# Dev node is small (Standard_DS2_v2: 2 vCPU / 7 GB).
# Lower resource requests so all ArgoCD components fit comfortably.
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# HA is overkill for dev — keep single replicas (chart defaults already do this,
# explicit here for clarity).
redis-ha:
  enabled: false

# No SSO in dev — built-in admin login is enough. Chart defaults dex to enabled;
# this disables the pod so it doesn't consume resources.
dex:
  enabled: false

configs:
  params:
    # TLS is terminated by the layer in front of argocd-server (port-forward in dev,
    # ingress in prod). Without this, argocd-server presents a self-signed cert.
    server.insecure: true

  # Repos ArgoCD is allowed to access. Per-env so prod can register a different
  # repo or use credentials.
  repositories:
    app-deployer:
      url: https://github.com/Pritam224/Internal-developer-Platform
      type: git
      name: Internal-developer-Platform

# Bootstrap Application — created by helm install alongside ArgoCD itself.
# Watches infra-manifest/ in the repo and syncs everything there to the cluster.
extraObjects:
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: root
      namespace: argocd
      annotations:
        # Delay creation until ArgoCD (and its CRDs) are fully installed
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-weight: "5"
    spec:
      project: default
      source:
        repoURL: https://github.com/Pritam224/Internal-developer-Platform
        path: infra-manifest/dev
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
