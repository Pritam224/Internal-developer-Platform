apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  namespace: argocd
  name: kube-prometheus-stack
spec:
  project: default
  sources:
  - repoURL: https://github.com/Pritam224/Internal-developer-Platform
    targetRevision: main
    ref: values
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.17.0
    helm:
      releaseName: kube-prometheus-stack
      valueFiles:
        - $values/infra-manifest/dev/monitoring/kube-prometheus-stack/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true