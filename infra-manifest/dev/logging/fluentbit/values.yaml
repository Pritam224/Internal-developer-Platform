# Fluent Bit — DEV overrides ONLY. Everything omitted inherits the chart
# defaults (kind: DaemonSet, tail + systemd inputs, kubernetes filter, RBAC,
# probes, volumes). Helm DEEP-MERGES the `config` map, so we override only
# `config.outputs`; `service`/`inputs`/`filters` keep the chart defaults.

resources:
  requests:
    cpu: 50m
    memory: 150Mi
  limits:
    memory: 300Mi

env:
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-es-elastic-user   
        key: elastic

config:
  # Ship to the ECK-managed Elasticsearch HTTP service (`elasticsearch-es-http`),
  # over HTTPS (tls On) with the `elastic` superuser. ECK is secure-by-default.
  # Suppress_Type_Name On is REQUIRED for ES 8.x (mapping types were removed) —
  # without it every write fails. Both outputs need it.
  outputs: |
    [OUTPUT]
        Name               es
        Match              kube.*
        Host               elasticsearch-es-http
        http_user          elastic
        http_passwd        ${ES_PASSWORD}
        Port               9200
        tls                On
        tls.verify         Off
        Logstash_Format    On
        Logstash_Prefix    fluentbit
        Suppress_Type_Name On
        Retry_Limit        False

    [OUTPUT]
        Name               es
        Match              host.*
        Host               elasticsearch-es-http
        http_user          elastic
        http_passwd        ${ES_PASSWORD}
        Port               9200
        tls                On
        tls.verify         Off
        Logstash_Format    On
        Logstash_Prefix    node
        Suppress_Type_Name On
        Retry_Limit        False
